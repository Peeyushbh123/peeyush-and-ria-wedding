<style>
/* Peeyush & Ria — cinematic wedding polish */
:root { scroll-behavior:smooth; }
body { overflow-x:hidden; }
#romance-atmosphere { position:fixed; inset:0; pointer-events:none; z-index:60; overflow:hidden; contain:layout paint; }
.romance-petal { position:absolute; top:-12vh; width:11px; height:17px; border-radius:80% 10% 75% 20%; opacity:0; background:linear-gradient(145deg,#fff0e6 0%,#d98b91 45%,#a63d55 100%); box-shadow:0 1px 5px #7d26351f; animation:petalJourney var(--duration,13s) var(--delay,0s) linear infinite; }
.romance-petal:nth-child(3n) { width:8px;height:12px;background:linear-gradient(145deg,#fff7d6,#d4af37);border-radius:50% 0 50% 0; }
.romance-petal:nth-child(4n) { width:5px;height:5px;border-radius:50%;background:#f3d98b;box-shadow:0 0 9px #e6c66d; }
@keyframes petalJourney { 0%{transform:translate3d(0,-5vh,0) rotate(0deg) scale(.7);opacity:0} 8%{opacity:.7} 45%{transform:translate3d(7vw,48vh,0) rotate(230deg) scale(1);opacity:.58} 88%{opacity:.4} 100%{transform:translate3d(-5vw,112vh,0) rotate(540deg) scale(.75);opacity:0} }
.cinematic-reveal { opacity:0; transform:translateY(26px) scale(.985); filter:blur(3px); transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1),filter .9s ease; }
.cinematic-reveal.is-visible { opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
/* Warm glints travel across the invitation's existing gold borders. */
main section { position:relative; }
main section::after { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; opacity:0; background:linear-gradient(115deg,transparent 0%,rgba(255,255,255,0) 34%,rgba(255,246,200,.55) 48%,rgba(255,255,255,0) 60%,transparent 100%); transform:translateX(-120%); }
main section.is-visible::after { opacity:.7; animation:goldenSweep 1.8s .35s ease-out 1; }
@keyframes goldenSweep { 0%{transform:translateX(-120%);opacity:0} 15%{opacity:.8} 100%{transform:translateX(120%);opacity:0} }
/* Elegant movement without changing the original palette or layout. */
main h1, main h2 { text-shadow:0 2px 14px rgba(184,149,47,.13); }
main section button, main a, main [role="button"] { transition:transform .28s ease, box-shadow .28s ease, filter .28s ease; }
@media (hover:hover) and (pointer:fine) {
 main section button:hover, main a:hover, main [role="button"]:hover { transform:translateY(-2px); filter:brightness(1.035); }
}
#romance-glow { position:fixed; width:240px;height:240px; border-radius:50%; left:-120px;top:-120px;pointer-events:none;z-index:0;background:radial-gradient(circle,rgba(232,213,160,.13),transparent 70%); }
.romance-heart-burst { position:fixed; z-index:90; pointer-events:none; font-size:15px; color:#c39b3e; text-shadow:0 1px 8px #e8d5a0; animation:heartLift 950ms ease-out forwards; }
@keyframes heartLift { 0%{opacity:0;transform:translate(-50%,-30%) scale(.5) rotate(-15deg)} 18%{opacity:1} 100%{opacity:0;transform:translate(calc(-50% + var(--drift,18px)),-95px) scale(1.25) rotate(18deg)} }
@media (prefers-reduced-motion:reduce) {
 *,*::before,*::after { scroll-behavior:auto!important; animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; }
 .cinematic-reveal { opacity:1;transform:none;filter:none; }
 #romance-atmosphere,#romance-glow { display:none!important; }
}
</style>
